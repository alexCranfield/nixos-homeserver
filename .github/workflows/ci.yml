# CI (continuous integration). Validates every pull request and every push to
# main on GitHub-hosted runners, so main is always something comin can deploy
# (ADR, Architecture Decision Record, 0003 in docs/adr/). The checks are split
# into shards, each a job on its own runner, so the VM (virtual machine) tests
# run in parallel and the run stays under the job limit (#180). Each shard runs
# `just check-shard <name>`, and `just check` runs them all locally, so CI and
# the workstation cannot drift apart. .github/ci-shards.json lists the shards.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The job only reads the repository. A public repo accepts pull requests from
# anyone, so the token gets nothing it does not need.
permissions:
  contents: read

# A new push to the same pull request makes the older run pointless, so pull
# requests share one group per branch and cancel. Each commit on main gets a
# group of its own: GitHub keeps only one pending run per group, so a shared
# group would drop results during back-to-back merges.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The shard names, read from the file `just check-shard` reads, so the
  # matrix below cannot list a shard the justfile does not know, or miss one.
  list-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      names: ${{ steps.read.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read .github/ci-shards.json
        id: read
        run: |
          names=$(jq -c 'keys' .github/ci-shards.json)
          echo "shards: $names"
          echo "names=$names" >> "$GITHUB_OUTPUT"

  shard:
    needs: list-shards
    runs-on: ubuntu-latest
    # Before #180 every VM test shared one job and two build slots, and a
    # change to the host took 76 minutes of this limit; the alerting test
    # alone took about 50 (#27). Since #182 it is two halves in different
    # shards, each expected to take about 16 minutes, and the limit stays
    # until the shards' measured times show what a cold run takes.
    timeout-minutes: 90
    strategy:
      # A failing shard does not cancel the others: their results still
      # report, and the checks they passed are cached for the next run.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.list-shards.outputs.names) }}
    # Whether this run may use the Nix store cache (#137): pushes to main, and
    # pull requests from branches of this repository. Not pull requests from
    # forks: an early commit's run could save outputs that were never built,
    # and a later commit's run would restore them and pass checks it never
    # ran. Main's own caches are out of a pull request's reach either way.
    env:
      USE_CACHE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      SHARD: ${{ matrix.shard }}
    steps:
      # Actions are pinned by commit, not tag: a tag can be moved to different
      # code after review, a commit hash cannot. The comment records the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the token in .git/config while pull request code runs.
          persist-credentials: false

      # Upstream Nix, the same distribution the server runs, rather than
      # Determinate Nix. ADR 0007: CI checks what the server will evaluate.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # At most two builds at once, so at most two VM tests: the runner has
          # 16 GB, and four tests booting together (about ten VMs, 10 GB of
          # guest memory) got the runner killed twice on 2026-10-24 (#133,
          # docs/runbooks/ci.md). Each shard has a runner of its own.
          extra_nix_config: |
            max-jobs = 2

      # The store from an earlier run (#137), so a check whose derivation is
      # unchanged is already built and `just check-shard` skips it: a
      # docs-only change builds nothing, and a code change reruns only the
      # checks it touches. Each shard saves under its own key, so shards
      # never restore each other's stores; the newest cache of this shard
      # that this ref can see is restored, its own branch's first, then
      # main's. GitHub keeps caches per branch, so a pull request reads
      # main's but cannot write it. Shard names have no hyphen (`just
      # check-shards-complete` fails on one), so one shard's prefix cannot
      # match another's keys. The key carries the attempt: a cache cannot be
      # overwritten, so a re-run of a failed job (a flaky test, #130) would
      # otherwise find its commit's key taken by the failed attempt's partial
      # store and save nothing, leaving that partial cache in use until the
      # next commit.
      - name: Restore Nix store
        id: nix-cache
        if: ${{ env.USE_CACHE == 'true' }}
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ matrix.shard }}-

      # The installer's Nix only enters the dev shell. The checks run with the
      # dev shell's Nix, which is the server's version; print both as evidence.
      # Entering the shell evaluates flake.nix, so a syntax error there fails
      # here, before `just check-shard`.
      # The store as restored, so the trim step below can tell whether this
      # run added anything worth saving.
      - name: Enter dev shell (evaluates flake.nix)
        run: |
          find /nix/store -mindepth 1 -maxdepth 1 -printf '%f\n' | sort > "$RUNNER_TEMP/restored-paths"
          echo "installer: $(nix --version)"
          echo "dev shell: $(nix develop --command nix --version)"

      # Checks restored above are skipped; the rest build, fetching what they
      # can from cache.nixos.org. See docs/runbooks/ci.md. The recipe writes
      # each check's name and derivation to $CHECK_DRVS for the trim step.
      - name: just check-shard
        run: CHECK_DRVS="$RUNNER_TEMP/check-drvs" nix develop --command just check-shard "$SHARD"

      # Keep what the next run needs and nothing else: every check of this
      # shard that passed, with its closure. A failed check has no output, so
      # it reruns next time. Everything else, such as build inputs and the
      # dev shell, comes from cache.nixos.org again, which keeps the cache
      # small enough that the repo's 10 GB limit does not evict main's. The
      # derivations are the ones `just check-shard` evaluated and wrote down,
      # so this step evaluates nothing. If the list is missing, as when the
      # recipe failed before writing it, the step warns and nothing is saved:
      # the next run restores the last cache saved and reruns what changed.
      - name: Keep only built checks
        id: keep
        if: ${{ !cancelled() && env.USE_CACHE == 'true' }}
        shell: bash
        run: |
          roots="$RUNNER_TEMP/check-roots"
          mkdir -p "$roots"
          if [ ! -s "$RUNNER_TEMP/check-drvs" ]; then
            echo "::warning::no list of check derivations from just check-shard; not saving the Nix store cache"
            exit 0
          fi
          while read -r name drv; do
            path=$(nix-store --query --outputs "$drv")
            if [ -z "$(nix-store --check-validity --print-invalid "$path")" ]; then
              nix-store --add-root "$roots/$name" --realise "$path" >/dev/null
              echo "kept $name"
            else
              echo "not built: $name"
            fi
          done < "$RUNNER_TEMP/check-drvs"
          nix store gc
          echo "store: $(du -sh /nix/store | cut -f1)"
          new=$(find /nix/store -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | comm -23 - "$RUNNER_TEMP/restored-paths" | wc -l)
          echo "paths not in the restored cache: $new"
          if [ "$new" -gt 0 ]; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi

      # Not after a failed step above: that store was never trimmed. Not when
      # the trimmed store holds nothing the restored cache lacked, as after a
      # docs-only change: the cache restored is still the one to use.
      - name: Save Nix store
        if: ${{ !cancelled() && steps.keep.outputs.save == 'true' }}
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: ${{ steps.nix-cache.outputs.primary-key }}

  # The required status check: ruleset `main` requires a check named `check`,
  # and a matrix job reports as `shard (<name>)`, so this job stands for all
  # of them. It runs whatever happened above (`always()`): a job skipped
  # because what it needs failed reports as skipped, and GitHub counts a
  # skipped required check as passing. So it fails unless every job it needs
  # succeeded, which for the matrix means every shard did.
  check:
    needs: [list-shards, shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if ! jq -e 'length > 0 and all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null; then
            echo "::error::a job this check needs did not succeed; see the results above"
            exit 1
          fi
