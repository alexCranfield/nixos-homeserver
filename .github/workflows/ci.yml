# CI (continuous integration). Validates every pull request and every push to
# main on GitHub-hosted runners, so main is always something comin can deploy
# (ADR, Architecture Decision Record, 0003 in docs/adr/). The steps are
# `just check`, the same target run locally, so CI and the workstation cannot
# drift apart.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The job only reads the repository. A public repo accepts pull requests from
# anyone, so the token gets nothing it does not need.
permissions:
  contents: read

# A new push to the same pull request makes the older run pointless, so pull
# requests share one group per branch and cancel. Each commit on main gets a
# group of its own: GitHub keeps only one pending run per group, so a shared
# group would drop results during back-to-back merges.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # Two builds at a time (below) makes the run longer than it was with four.
    timeout-minutes: 45
    steps:
      # Actions are pinned by commit, not tag: a tag can be moved to different
      # code after review, a commit hash cannot. The comment records the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the token in .git/config while pull request code runs.
          persist-credentials: false

      # Upstream Nix, the same distribution the server runs, rather than
      # Determinate Nix. ADR 0007: CI checks what the server will evaluate.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # At most two builds at once, so at most two VM tests: the runner has
          # 16 GB, and four tests booting together (about ten VMs, 10 GB of
          # guest memory) got the runner killed twice on 2026-10-24 (#133,
          # docs/runbooks/ci.md).
          extra_nix_config: |
            max-jobs = 2

      # The store from an earlier run (#137), so a check whose derivation is
      # unchanged is already built and `nix flake check` skips it: a docs-only
      # change builds nothing, and a code change reruns only the checks it
      # touches. Each run saves under its own key; the newest cache this ref
      # can see is restored, its own branch's first, then main's. GitHub keeps
      # caches per branch, so a pull request reads main's but cannot write it.
      - name: Restore Nix store
        id: nix-cache
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ github.sha }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # The installer's Nix only enters the dev shell. The checks run with the
      # dev shell's Nix, which is the server's version; print both as evidence.
      # Entering the shell evaluates flake.nix, so a syntax error there fails
      # here, before `just check`.
      # The store as restored, so the trim step below can tell whether this
      # run added anything worth saving.
      - name: Enter dev shell (evaluates flake.nix)
        run: |
          find /nix/store -mindepth 1 -maxdepth 1 -printf '%f\n' | sort > "$RUNNER_TEMP/restored-paths"
          echo "installer: $(nix --version)"
          echo "dev shell: $(nix develop --command nix --version)"

      # Checks restored above are skipped; the rest build, fetching what they
      # can from cache.nixos.org. See docs/runbooks/ci.md. The log is kept for
      # the trim step, which reads the checks' derivations from it.
      - name: just check
        shell: bash
        run: nix develop --command just check 2>&1 | tee "$RUNNER_TEMP/check.log"

      # Keep what the next run needs and nothing else: every check that passed,
      # with its closure. A failed check has no output, so it reruns next time.
      # Everything else, such as build inputs and the dev shell, comes from
      # cache.nixos.org again, which keeps the cache small enough that the
      # repo's 10 GB limit does not evict main's. The derivations come from
      # `nix flake check`'s own log ("checking derivation <name>" then
      # "derivation evaluated to <drv>"), since evaluating the flake again
      # takes three minutes. If the log changes shape and none are found, the
      # step fails and nothing is saved, so the next run is a full one, never a
      # wrong one.
      - name: Keep only built checks
        id: keep
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          roots="$RUNNER_TEMP/check-roots"
          mkdir -p "$roots"
          # The name from each "checking derivation checks.<system>.<name>..."
          # line, paired with the "derivation evaluated to" line after it.
          # Other outputs' lines (the dev shell, the formatter) clear the name.
          awk '
            match($0, /checking derivation checks\.x86_64-linux\.[^.]+\.\.\./) {
              name = substr($0, RSTART + 40, RLENGTH - 43); next
            }
            /checking derivation / { name = ""; next }
            match($0, /derivation evaluated to \/nix\/store\/[^ ]+\.drv/) {
              if (name != "") print name, substr($0, RSTART + 24, RLENGTH - 24)
              name = ""
            }
          ' "$RUNNER_TEMP/check.log" > "$RUNNER_TEMP/check-drvs"
          if [ ! -s "$RUNNER_TEMP/check-drvs" ]; then
            echo "no check derivations found in the log" >&2
            exit 1
          fi
          while read -r name drv; do
            path=$(nix-store --query --outputs "$drv")
            if [ -z "$(nix-store --check-validity --print-invalid "$path")" ]; then
              nix-store --add-root "$roots/$name" --realise "$path" >/dev/null
              echo "kept $name"
            else
              echo "not built: $name"
            fi
          done < "$RUNNER_TEMP/check-drvs"
          nix store gc
          echo "store: $(du -sh /nix/store | cut -f1)"
          new=$(find /nix/store -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | comm -23 - "$RUNNER_TEMP/restored-paths" | wc -l)
          echo "paths not in the restored cache: $new"
          if [ "$new" -gt 0 ]; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi

      # Not after a failed step above: that store was never trimmed. Not when
      # the trimmed store holds nothing the restored cache lacked, as after a
      # docs-only change: the cache restored is still the one to use.
      - name: Save Nix store
        if: ${{ !cancelled() && steps.keep.outputs.save == 'true' }}
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: ${{ steps.nix-cache.outputs.primary-key }}
