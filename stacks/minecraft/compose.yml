# Minecraft with the All the Mods 9 (ATM9) modpack, ticket 4.1 (#28). The
# image installs the pinned pack from CurseForge on its first start, and again
# only when CF_FILE_ID changes. Friends reach it through Tailscale sharing
# (ADR (Architecture Decision Record) 0011); docs/runbooks/minecraft.md.
services:
  server:
    # Java 17, which ATM9 (Minecraft 1.20.1, Forge) needs.
    image: itzg/minecraft-server:2026.10.0-java17
    # The stack's own ids, so the world on disk belongs to stack-minecraft.
    # The image then skips its own switch from root to the UID and GID (user
    # and group IDs) it is given.
    user: "${STACK_UID}:${STACK_GID}"
    environment:
      EULA: "TRUE"
      TYPE: AUTO_CURSEFORGE
      CF_SLUG: all-the-mods-9
      # All the Mods 9-1.1.1, uploaded 2025-10-12. The pack file, not the
      # server file: the image reads the pack's manifest. Changing it
      # reinstalls the pack over the world on the next start.
      CF_FILE_ID: "7097953"
      CF_API_KEY_FILE: /run/secrets/cf-api-key
      # Heap. The stack's memoryMax sits above it for the JVM's (Java virtual machine's) own use.
      MEMORY: 12G
      ONLINE_MODE: "TRUE"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      # Player names, comma-separated, from the stack's .env: the `env` key
      # of secrets/minecraft.yaml, kept out of this public file. They replace
      # the server's whitelist at each start, so that list is the whole of it.
      WHITELIST: ${WHITELIST:?set WHITELIST in the env key of secrets/minecraft.yaml}
      EXISTING_WHITELIST_FILE: SYNCHRONIZE
      # RCON (remote console) stays inside the container: the snapshot hooks
      # use `rcon-cli` through `docker exec`, and nothing publishes its port.
      # The image makes a new password at each start.
      ENABLE_RCON: "TRUE"
      # The join-protection datapack below. The image copies it into
      # world/datapacks at each start.
      DATAPACKS: /datapacks/join-protection
    secrets:
      - cf-api-key
    # Bump this whenever the text of a jp-* config changes. Compose recreates
    # the container only when the service's own settings change, and the
    # configs' text is not one of them; it is copied in at creation.
    labels:
      homeserver.join-protection: "1"
    # Mode 0644: the copy keeps it, and the next start's copy must be able
    # to overwrite the last one.
    configs:
      - source: jp-pack
        target: /datapacks/join-protection/pack.mcmeta
        mode: 0644
      - source: jp-load-tag
        target: /datapacks/join-protection/data/minecraft/tags/functions/load.json
        mode: 0644
      - source: jp-tick-tag
        target: /datapacks/join-protection/data/minecraft/tags/functions/tick.json
        mode: 0644
      - source: jp-load
        target: /datapacks/join-protection/data/join_protection/functions/load.mcfunction
        mode: 0644
      - source: jp-tick
        target: /datapacks/join-protection/data/join_protection/functions/tick.mcfunction
        mode: 0644
      - source: jp-protect
        target: /datapacks/join-protection/data/join_protection/functions/protect.mcfunction
        mode: 0644
    ports:
      - "0.0.0.0:25565:25565"
    volumes:
      - /srv/data/minecraft:/data
    # The image's own check gives up about three minutes in, and the unit's
    # `up --wait` would then fail a start that is only slow. A modpack this
    # size takes longer than that; the unit's 15 minutes are the limit.
    healthcheck:
      test: mc-health
      start_period: 15m
      start_interval: 10s
      interval: 30s
      retries: 3
    # The image asks the server to stop and allows it 60 seconds to save.
    stop_grace_period: 75s

secrets:
  cf-api-key:
    file: /run/secrets/minecraft-cf-api-key

# Join protection (#154). The pack's clients load slowly, and the server puts a
# player in the world before they can see or move, so mobs got to them first.
# This datapack gives a joining player Resistance V, which blocks all damage
# from mobs and falls, for 30 seconds. It is server-side only: clients need
# nothing. "Joining" is a player the scoreboard has not marked as on since the
# server started, or one whose leave_game statistic counts a logout since they
# were last protected. Minecraft 1.20.1 (pack format 15, `functions`
# directories). The files are inline, so no host file is mounted.
configs:
  jp-pack:
    content: |
      {"pack": {"pack_format": 15, "description": "Protect players for 30 seconds as they join"}}
  jp-load-tag:
    content: |
      {"values": ["join_protection:load"]}
  jp-tick-tag:
    content: |
      {"values": ["join_protection:tick"]}
  jp-load:
    content: |
      scoreboard objectives add jp.left minecraft.custom:minecraft.leave_game
      scoreboard objectives add jp.on dummy
      scoreboard players reset * jp.on
  jp-tick:
    content: |
      execute as @a[scores={jp.left=1..}] run function join_protection:protect
      execute as @a unless score @s jp.on matches 1 run function join_protection:protect
  jp-protect:
    content: |
      effect give @s minecraft:resistance 30 4 true
      scoreboard players set @s jp.on 1
      scoreboard players set @s jp.left 0
