# Which age keys can decrypt which files.
#
# Rules are evaluated in order and the FIRST match wins, so the narrow test rule
# must stay above the general one.
#
# Adding a recipient does not re-encrypt existing files. After changing this,
# run `sops updatekeys secrets/<file>` for every affected file.
keys:
  # Alex's workstation. Backed up off-machine; the location is recorded in the
  # password manager rather than here. Losing this key without that backup
  # loses every secret in this repo.
  - &workstation age1uppr6k46nwa0d24tcmgjuacquuyy0n4klv6gnyd8fuxu7gc5tg9suljj67
  # Throwaway key used only to prove decryption inside a local test VM. Not
  # backed up: if lost, generate a new one and re-run `sops updatekeys` on the
  # test file. Deliberately scoped to that one file so it can never decrypt a
  # real secret.
  - &vm-test age12fy2yazfa0z7e43crk0umnrkv467k9rzgpdtwu9ajcl35sut29vsrgcpyd

creation_rules:
  # The bootstrap test secret. Contains nothing sensitive.
  - path_regex: ^secrets/test\.yaml$
    key_groups:
      - age:
          - *workstation
          - *vm-test

  # Everything else. The nuc host key joins in ticket 1.7 (#14), once the
  # machine exists and its SSH host key can be converted with ssh-to-age.
  #
  # It must be added to BOTH rules, not just this one. Rules are first-match,
  # so secrets/test.yaml never reaches here, and #14's acceptance criterion is
  # reading /run/secrets/test on the nuc.
  - path_regex: ^secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *workstation
